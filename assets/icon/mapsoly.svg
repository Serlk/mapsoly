<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17a383"/>
      <stop offset="1" stop-color="#06392f"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f7ee"/>
    </linearGradient>
    <clipPath id="shape"><rect width="512" height="512" rx="116"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- a hint of a street grid -->
    <g stroke="#ffffff" stroke-opacity="0.09" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M-20 150 L540 60"/>
      <path d="M-20 330 L540 240"/>
      <path d="M90 -20 L170 540"/>
      <path d="M380 -20 L460 540"/>
    </g>
    <!-- the route: a band with the traffic running down its middle -->
    <path id="route" d="M96 452 C 110 330, 180 322, 236 300 S 318 236, 322 196"
          fill="none" stroke="#0a2c25" stroke-opacity="0.35" stroke-width="64" stroke-linecap="round" filter="url(#soft)"/>
    <path d="M96 452 C 110 330, 180 322, 236 300 S 318 236, 322 196"
          fill="none" stroke="#9cf0d6" stroke-width="52" stroke-linecap="round"/>
    <path d="M96 452 C 110 330, 180 322, 236 300 S 318 236, 322 196"
          fill="none" stroke="#35c978" stroke-width="20" stroke-linecap="round"/>
    <path d="M96 452 C 110 330, 180 322, 236 300 S 318 236, 322 196"
          fill="none" stroke="#ffc83d" stroke-width="20" stroke-linecap="butt"
          stroke-dasharray="0 150 80 1000"/>
    <path d="M96 452 C 110 330, 180 322, 236 300 S 318 236, 322 196"
          fill="none" stroke="#f0503a" stroke-width="20" stroke-linecap="butt"
          stroke-dasharray="0 230 62 1000"/>
    <!-- the arrow at the head of the route -->
    <g transform="translate(330 166) rotate(14)">
      <path d="M0 -118 L92 96 L0 46 L-92 96 Z" fill="#06392f" fill-opacity="0.45"
            transform="translate(0 12)" filter="url(#soft)"/>
      <path d="M0 -118 L92 96 L0 46 L-92 96 Z" fill="url(#arrow)"
            stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
